; Invoice Guard demo: one SIP account for the "vendor's phone" (Linphone on the same hotspot).
; __SIP_PASSWORD__ is filled in by voice/setup.sh; the real value lives only in ~/.invoice-guard-voice.env.

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[vendor-demo]
type=endpoint
context=invoice-guard-in        ; calls FROM the phone go nowhere (see extensions.conf)
disallow=all
allow=ulaw,alaw                 ; Linphone offers PCMU/PCMA by default
auth=vendor-demo-auth
aors=vendor-demo
direct_media=no
rtp_symmetric=yes               ; hotspot NAT friendliness
force_rport=yes
rewrite_contact=yes

[vendor-demo-auth]
type=auth
auth_type=userpass
username=vendor-demo
password=__SIP_PASSWORD__

[vendor-demo]
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=30
